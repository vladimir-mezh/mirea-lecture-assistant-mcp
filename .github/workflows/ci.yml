name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      app_ref:
        description: Lecture Assistant branch or tag to check the packaged MCP against
        default: master
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # The app's installer and local API, to run the packaged launcher and
      # adapter against them as a user's PC would.
      - uses: actions/checkout@v4
        with:
          repository: vladimir-mezh/mirea-lecture-assistant
          ref: ${{ inputs.app_ref || 'master' }}
          path: lecture-assistant
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -c requirements-build.txt -e . pytest pyinstaller
      - run: python -m pytest
      - run: python scripts/package.py
      - name: Packaged launcher, adapter and update checks
        run: python -m pytest -rs
