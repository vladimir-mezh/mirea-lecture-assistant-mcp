name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      app_ref:
        description: Lecture Assistant branch or tag to check the packaged MCP against
        default: master
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # The app's installer and local API, to run the packaged launcher and
      # adapter against them as a user's PC would.
      - uses: actions/checkout@v4
        with:
          repository: vladimir-mezh/mirea-lecture-assistant
          ref: ${{ inputs.app_ref || 'master' }}
          path: lecture-assistant
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: native/go.sum
      - run: python -m pip install -c requirements-build.txt -e . pytest
      - name: Native unit tests and dependency verification
        working-directory: native
        run: |
          go mod verify
          go test -race ./...
          go vet ./...
      - run: python -m pytest
      - run: python scripts/package.py
      - name: Packaged launcher, adapter and update checks
        run: python -m pytest -rs
      - uses: actions/upload-artifact@v4
        with:
          name: MireaAssistantMcp-native-windows
          path: |
            dist/MireaAssistantMcp-windows-x64.zip
            dist/MireaAssistantMcp-windows-x64.zip.sha256
