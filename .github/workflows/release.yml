name: Independent MCP release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -c requirements-build.txt -e . pytest pyinstaller
      - name: Check release version
        run: python -c "import os,tomllib; v=tomllib.load(open('pyproject.toml','rb'))['project']['version']; assert os.environ['GITHUB_REF_NAME']=='v'+v"
      - run: python -m pytest
      - run: python scripts/package.py
      - run: python -m pytest
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MireaAssistantMcp-windows-x64.zip
            dist/MireaAssistantMcp-windows-x64.zip.sha256
