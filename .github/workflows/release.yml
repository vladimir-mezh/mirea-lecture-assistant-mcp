name: Independent MCP release
# A version bump merged into main publishes the release v<version>, as in
# Lecture Assistant; a pushed v* tag or a manual run does the same.
on:
  push:
    branches: [main]
    paths: [src/mirea_assistant_mcp/__init__.py]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: vladimir-mezh/mirea-lecture-assistant
          ref: master
          path: lecture-assistant
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -c requirements-build.txt -e . pytest pyinstaller
      - name: Release version
        id: version
        run: python scripts/release_tag.py
      - run: python -m pytest
      - run: python scripts/package.py
      - name: Packaged launcher, adapter and update checks
        run: python -m pytest -rs
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: MIREA Lecture Assistant MCP ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/MireaAssistantMcp-windows-x64.zip
            dist/MireaAssistantMcp-windows-x64.zip.sha256
