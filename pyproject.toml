[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mirea-lecture-assistant-mcp"
version = "0.1.2"
description = "Independent optional MCP adapter for MIREA Lecture Assistant"
requires-python = ">=3.11"
dependencies = ["mcp>=1.20,<2"]
license = {text = "MIT"}
readme = "README.md"

[project.scripts]
mirea-assistant-mcp = "mirea_assistant_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mirea_assistant_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
